<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting</title>
    <meta name="description" content="Get in touch with White Water Rafting for questions, trip reservations, or location details. We are here to help you plan your next adventure.">
    <link rel="stylesheet" href="styles/rafting.css">
    <link rel="stylesheet" href="styles/contact.css">
</head>
<body>

    <main>
        <section class="company-info">
            <h1>Contact Us</h1>
            <div class="info-grid">
                <div class="details">
                    <p><strong>Address:</strong> 123 Rapid River Way, Boise, ID 83702</p>
                    <p><strong>Phone:</strong> (208) 555-0199</p>
                    <p><strong>Email:</strong> info@wwrafting.com</p>
                </div>
                <div class="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2892.483935293675!2d-116.2023!3d43.615!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNDPCsDM2JzU0LjAiTiAxMTbCsDEyJzA4LjMiVw!5e0!3m2!1sen!2sus!4v1620000000000!5m2!1sen!2sus" width="400" height="300" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </section>

        <section class="employees">
            <h2>Our Team</h2>
            <div class="employee-cards">
                <figure>
                    <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=300" alt="Jane Doe, Lead Guide">
                    <figcaption>Jane Doe - Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=300" alt="John Smith, Operations Manager">
                    <figcaption>John Smith - Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=300" alt="Alex Rivera, Safety Director">
                    <figcaption>Alex Rivera - Safety Director</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">
                <div class="form-item">
                    <label for="username">Name:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-item">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <fieldset class="form-item radio-group">
                    <legend>Purpose of Message:</legend>
                    <label><input type="radio" id="general" name="purpose" value="general" checked> General Inquiry</label>
                    <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

</body>
</html>
