<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML and CSS Quiz</title>
    <meta name="description" content="A simple online quiz to test knowledge of basic HTML and CSS concepts for WDD 130.">
    <meta name="author" content="Gabriel Rosa Estrella Silveira">
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>
    <main>
        <form action="#" method="post">
            <!-- Question 1: Text Input -->
            <div class="form-item">
                <label for="q1">1. What does CSS stand for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Question 2: Textarea -->
            <div class="form-item">
                <label for="q2">2. Explain the difference between HTML and CSS in your own words:</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <!-- Question 3: Select Dropdown -->
            <div class="form-item">
                <label for="q3">3. Which HTML tag is used to define an internal style sheet?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="css">&lt;css&gt;</option>
                    <option value="script">&lt;script&gt;</option>
                    <option value="style">&lt;style&gt;</option>
                </select>
            </div>

            <!-- Question 4: Number Input -->
            <div class="form-item">
                <label for="q4">4. How many heading levels does HTML support (h1 to h?):</label>
                <input type="number" id="q4" name="q4" min="1" max="10" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 HTML and CSS Quiz | WDD 130</p>
    </footer>
</body>
</html>
